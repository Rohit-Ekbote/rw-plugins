# llm-endpoint: internal-openai (llmBaseUrl=https://llm.internal.example/v1, llmApiKeySecret=llm-gateway-key)
llmGateway:
  deploy: true
  providersExistingSecret: llm-gateway-key
  models:
    - model_name: customer-chat
      litellm_params:
        model: openai/gpt-4o
        api_base: https://llm.internal.example/v1
        api_key: "os.environ/LLM_API_KEY"
    - model_name: customer-bg
      litellm_params:
        model: openai/gpt-4o-mini
        api_base: https://llm.internal.example/v1
        api_key: "os.environ/LLM_API_KEY"
    - model_name: customer-embedding
      litellm_params:
        model: openai/text-embedding-3-small
        api_base: https://llm.internal.example/v1
        api_key: "os.environ/LLM_API_KEY"
