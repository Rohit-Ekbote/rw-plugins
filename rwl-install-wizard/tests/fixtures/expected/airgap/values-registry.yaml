# Expected values-registry.yaml for the airgap profile (mirrored-per-upstream).
# INVARIANT: per-upstream, path-preserving — every image ref keeps its source
# path under a docker-* remote on the mirror, so the rendered ref equals the
# air-gap image-manifest push target. NO registryOverride (it would collapse paths
# and disagree with the manifest → ImagePullBackOff). Validated: helm template
# (release rw-airgap) renders every image on the mirror, zero public refs.
x-airgap-pinned-tags-notice:
  warning: >-
    PINNED subchart image tags in this overlay target chart ~0.2.x. VERIFY
    each against your Chart.lock (run `helm dependency update`, then read
    Chart.lock) and the air-gap image manifest in your USER-GUIDE before
    installing — the mirror must hold the exact tag your chart resolves, or
    the image pull fails. These full-value overrides beat the chart's own
    resolved subchart pins.
  pinnedTags:
    neo4j: "5.26.0"
    vault: "1.21.2"
    bciBaseHelmTest: "15.7"
global:
  imagePullSecrets:
    - name: jcr-pull-secret
  utility:
    busybox:
      registry: artifactory.corp.example/docker-dockerhub
    dbInit:
      registry: artifactory.corp.example/docker-dockerhub
    vaultClient:
      registry: artifactory.corp.example/docker-dockerhub
images:
  pullSecrets:
    - name: jcr-pull-secret
  registry: artifactory.corp.example/docker-runwhen-self-hosted/runwhen-self-hosted/platform-images
  mcpServer:
    registry: artifactory.corp.example/docker-ghcr/runwhen-contrib
  ccCatalog:
    registry: artifactory.corp.example/docker-ghcr/runwhen-contrib
  llmGateway:
    registry: artifactory.corp.example/docker-ghcr/berriai
runnerMetricProxy:
  image:
    registry: artifactory.corp.example/docker-ghcr/runwhen-contrib
ccCatalog:
  auth:
    dockerconfigjsonSecret: jcr-pull-secret
  config:
    sources:
      - name: mirror-remote-runwhen
        type: oci
        auth:
          dockerconfigjson_env: CC_CATALOG_DOCKERCONFIGJSON_FILE
        codecollections:
          - slug: rw-cli-codecollection
            name: RunWhen CLI CodeCollection
            git_url: https://github.com/runwhen-contrib/rw-cli-codecollection
            image_registry: artifactory.corp.example/docker-ghcr/runwhen-contrib/rw-cli-codecollection
          - slug: rw-public-codecollection
            name: RunWhen Public CodeCollection
            git_url: https://github.com/runwhen-contrib/rw-public-codecollection
            image_registry: artifactory.corp.example/docker-ghcr/runwhen-contrib/rw-public-codecollection
          - slug: rw-generic-codecollection
            name: RunWhen Generic CodeCollection
            git_url: https://github.com/runwhen-contrib/rw-generic-codecollection
            image_registry: artifactory.corp.example/docker-ghcr/runwhen-contrib/rw-generic-codecollection
          - slug: rw-workspace-utils
            name: RunWhen Workspace Utilities CodeCollection
            git_url: https://github.com/runwhen-contrib/rw-workspace-utils
            image_registry: artifactory.corp.example/docker-ghcr/runwhen-contrib/rw-workspace-utils
          - slug: aws-c7n-codecollection
            name: AWS CloudCustodian CodeCollection
            git_url: https://github.com/runwhen-contrib/aws-c7n-codecollection
            image_registry: artifactory.corp.example/docker-ghcr/runwhen-contrib/aws-c7n-codecollection
          - slug: azure-c7n-codecollection
            name: Azure CloudCustodian CodeCollection
            git_url: https://github.com/runwhen-contrib/azure-c7n-codecollection
            image_registry: artifactory.corp.example/docker-ghcr/runwhen-contrib/azure-c7n-codecollection
postgresql:
  spilo:
    image:
      registry: artifactory.corp.example/docker-ghcr/zalando
  pgbouncer:
    image:
      registry: artifactory.corp.example/docker-dockerhub
redis:
  image:
    registry: artifactory.corp.example/docker-dockerhub
    repository: bitnamilegacy/redis
neo4j:
  disableLookups: true   # MISSED-10: required with image.imagePullSecrets or the subchart aborts
  image:
    customImage: artifactory.corp.example/docker-dockerhub/library/neo4j:5.26.0   # PINNED-TAG — verify vs Chart.lock
    imagePullSecrets:
      - jcr-pull-secret
vault:
  server:
    image:
      repository: artifactory.corp.example/docker-dockerhub/hashicorp/vault
      tag: "1.21.2"                                                               # PINNED-TAG — verify vs Chart.lock
  autoUnseal:
    image:
      registry: artifactory.corp.example/docker-dockerhub
  backup:
    image:
      registry: artifactory.corp.example/docker-dockerhub
qdrant:
  disableLookups: true   # defensive parity (no-op for qdrant 1.18.2 — no such guard)
  image:
    repository: artifactory.corp.example/docker-dockerhub/qdrant/qdrant
  imagePullSecrets:
    - name: jcr-pull-secret
  chartTests:
    dbInteraction:
      image: artifactory.corp.example/docker-suse/bci/bci-base:15.7               # PINNED-TAG — verify vs Chart.lock
metricstore:
  image:
    registry: artifactory.corp.example/docker-dockerhub
seaweedfs:
  global:
    seaweedfs:
      image:
        name: artifactory.corp.example/docker-dockerhub/chrislusf/seaweedfs
  image:
    repository: artifactory.corp.example/docker-dockerhub/chrislusf/seaweedfs
codeCollections:
  - name: runwhen-collection
    repoUrl: https://github.com/runwhen-contrib/rw-public-codecollection.git
    branch: main
    watchAllBranches: true
    imageRegistry: artifactory.corp.example/docker-ghcr/runwhen-contrib
    imageRepo: rw-public-codecollection
  - name: runwhen-c7n-collection
    repoUrl: https://github.com/runwhen-contrib/azure-c7n-codecollection.git
    branch: main
    watchAllBranches: true
    imageRegistry: artifactory.corp.example/docker-ghcr/runwhen-contrib
    imageRepo: azure-c7n-codecollection
  - name: aws-c7n-cc
    repoUrl: https://github.com/runwhen-contrib/aws-c7n-codecollection.git
    branch: main
    watchAllBranches: true
    imageRegistry: artifactory.corp.example/docker-ghcr/runwhen-contrib
    imageRepo: aws-c7n-codecollection
  - name: runwhen-cli-collection
    repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
    branch: main
    watchAllBranches: true
    imageRegistry: artifactory.corp.example/docker-ghcr/runwhen-contrib
    imageRepo: rw-cli-codecollection
  - name: runwhen-generic-collection
    repoUrl: https://github.com/runwhen-contrib/rw-generic-codecollection.git
    branch: main
    watchAllBranches: true
    imageRegistry: artifactory.corp.example/docker-ghcr/runwhen-contrib
    imageRepo: rw-generic-codecollection
  - name: rw-workspace-utils
    repoUrl: https://github.com/runwhen-contrib/rw-workspace-utils.git
    branch: main
    watchAllBranches: true
    imageRegistry: artifactory.corp.example/docker-ghcr/runwhen-contrib
    imageRepo: rw-workspace-utils
