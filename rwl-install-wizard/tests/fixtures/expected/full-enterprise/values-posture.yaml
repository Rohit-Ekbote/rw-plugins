# security-posture: hardened (runAsUid=65534, runAsGid=65534)
# rbac-identity: byo (platformSaName=rw-platform, vaultBackupSaName=rw-vault-backup, postgresqlSaName=rw-postgresql)
global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  imagePullSecrets: []
serviceAccount:
  platform:
    create: false
    name: "rw-platform"
  vaultBackup:
    create: false
    name: "rw-vault-backup"
  postgresql:
    create: false
    name: "rw-postgresql"
vault:
  injector:
    enabled: false
  server:
    authDelegator:
      enabled: false
images:
  pullSecrets: []
