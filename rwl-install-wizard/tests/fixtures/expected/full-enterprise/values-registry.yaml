---
x-airgap-pinned-tags-notice:
  warning: PINNED subchart image tags in this overlay target chart ~0.2.x. VERIFY
    each against your Chart.lock (run `helm dependency update`, then read Chart.lock)
    and the air-gap image manifest in your USER-GUIDE before installing — the mirror
    must hold the exact tag your chart resolves, or the image pull fails. These full-value
    overrides beat the chart's own resolved subchart pins.
  pinnedTags:
    neo4j: 5.26.0
    vault: 1.21.2
    bciBaseHelmTest: '15.7'
global:
  imagePullSecrets:
  - name: jcr-pull-secret
  utility:
    busybox:
      registry: jcr.example.com/docker-dockerhub
    dbInit:
      registry: jcr.example.com/docker-dockerhub
    vaultClient:
      registry: jcr.example.com/docker-dockerhub
images:
  pullSecrets:
  - name: jcr-pull-secret
  registry: jcr.example.com/docker-runwhen-self-hosted/runwhen-self-hosted/platform-images
  mcpServer:
    registry: jcr.example.com/docker-ghcr/runwhen-contrib
  ccCatalog:
    registry: jcr.example.com/docker-ghcr/runwhen-contrib
  llmGateway:
    registry: jcr.example.com/docker-ghcr/berriai
runnerMetricProxy:
  image:
    registry: jcr.example.com/docker-ghcr/runwhen-contrib
ccCatalog:
  auth:
    dockerconfigjsonSecret: jcr-pull-secret
  config:
    sources:
    - name: mirror-remote-runwhen
      type: oci
      auth:
        dockerconfigjson_env: CC_CATALOG_DOCKERCONFIGJSON_FILE
      codecollections:
      - slug: rw-cli-codecollection
        name: RunWhen CLI CodeCollection
        git_url: https://github.com/runwhen-contrib/rw-cli-codecollection
        image_registry: jcr.example.com/docker-ghcr/runwhen-contrib/rw-cli-codecollection
      - slug: rw-public-codecollection
        name: RunWhen Public CodeCollection
        git_url: https://github.com/runwhen-contrib/rw-public-codecollection
        image_registry: jcr.example.com/docker-ghcr/runwhen-contrib/rw-public-codecollection
      - slug: rw-generic-codecollection
        name: RunWhen Generic CodeCollection
        git_url: https://github.com/runwhen-contrib/rw-generic-codecollection
        image_registry: jcr.example.com/docker-ghcr/runwhen-contrib/rw-generic-codecollection
      - slug: rw-workspace-utils
        name: RunWhen Workspace Utilities CodeCollection
        git_url: https://github.com/runwhen-contrib/rw-workspace-utils
        image_registry: jcr.example.com/docker-ghcr/runwhen-contrib/rw-workspace-utils
      - slug: aws-c7n-codecollection
        name: AWS CloudCustodian CodeCollection
        git_url: https://github.com/runwhen-contrib/aws-c7n-codecollection
        image_registry: jcr.example.com/docker-ghcr/runwhen-contrib/aws-c7n-codecollection
      - slug: azure-c7n-codecollection
        name: Azure CloudCustodian CodeCollection
        git_url: https://github.com/runwhen-contrib/azure-c7n-codecollection
        image_registry: jcr.example.com/docker-ghcr/runwhen-contrib/azure-c7n-codecollection
postgresql:
  spilo:
    image:
      registry: jcr.example.com/docker-ghcr/zalando
  pgbouncer:
    image:
      registry: jcr.example.com/docker-dockerhub
redis:
  image:
    registry: jcr.example.com/docker-dockerhub
    repository: bitnamilegacy/redis
neo4j:
  image:
    customImage: jcr.example.com/docker-dockerhub/library/neo4j:5.26.0
    imagePullSecrets:
    - jcr-pull-secret
vault:
  server:
    image:
      repository: jcr.example.com/docker-dockerhub/hashicorp/vault
      tag: 1.21.2
  autoUnseal:
    image:
      registry: jcr.example.com/docker-dockerhub
  backup:
    image:
      registry: jcr.example.com/docker-dockerhub
qdrant:
  image:
    repository: jcr.example.com/docker-dockerhub/qdrant/qdrant
  imagePullSecrets:
  - name: jcr-pull-secret
  chartTests:
    dbInteraction:
      image: jcr.example.com/docker-suse/bci/bci-base:15.7
metricstore:
  image:
    registry: jcr.example.com/docker-dockerhub
seaweedfs:
  global:
    seaweedfs:
      image:
        name: jcr.example.com/docker-dockerhub/chrislusf/seaweedfs
  image:
    repository: jcr.example.com/docker-dockerhub/chrislusf/seaweedfs
codeCollections:
- name: runwhen-collection
  repoUrl: https://github.com/runwhen-contrib/rw-public-codecollection.git
  branch: main
  watchAllBranches: true
  imageRegistry: jcr.example.com/docker-ghcr/runwhen-contrib
  imageRepo: rw-public-codecollection
- name: runwhen-c7n-collection
  repoUrl: https://github.com/runwhen-contrib/azure-c7n-codecollection.git
  branch: main
  watchAllBranches: true
  imageRegistry: jcr.example.com/docker-ghcr/runwhen-contrib
  imageRepo: azure-c7n-codecollection
- name: aws-c7n-cc
  repoUrl: https://github.com/runwhen-contrib/aws-c7n-codecollection.git
  branch: main
  watchAllBranches: true
  imageRegistry: jcr.example.com/docker-ghcr/runwhen-contrib
  imageRepo: aws-c7n-codecollection
- name: runwhen-cli-collection
  repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
  branch: main
  watchAllBranches: true
  imageRegistry: jcr.example.com/docker-ghcr/runwhen-contrib
  imageRepo: rw-cli-codecollection
- name: runwhen-generic-collection
  repoUrl: https://github.com/runwhen-contrib/rw-generic-codecollection.git
  branch: main
  watchAllBranches: true
  imageRegistry: jcr.example.com/docker-ghcr/runwhen-contrib
  imageRepo: rw-generic-codecollection
- name: rw-workspace-utils
  repoUrl: https://github.com/runwhen-contrib/rw-workspace-utils.git
  branch: main
  watchAllBranches: true
  imageRegistry: jcr.example.com/docker-ghcr/runwhen-contrib
  imageRepo: rw-workspace-utils
