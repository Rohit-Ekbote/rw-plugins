# Expected values-storage.yaml — STOXX hardened repro (pvc + bundled seaweedfs).
seaweedfs:
  master:
    data:
      storageClass: standard-rwo
  volume:
    dataDirs:
      - name: data1
        type: persistentVolumeClaim
        size: "20Gi"
        storageClass: standard-rwo
        maxVolumes: 60
  filer:
    data:
      type: persistentVolumeClaim
      storageClass: standard-rwo
      size: 5Gi
  deploy: true
  s3:
    existingConfigSecret: rw-stoxx-seaweedfs-identities
metricstore:
  persistence:
    kind: pvc
    storageClassName: standard-rwo
qdrant:
  persistence:
    storageClassName: standard-rwo
postgresql:
  spilo:
    persistence:
      kind: pvc
      storageClassName: standard-rwo
vault:
  server:
    dataStorage:
      enabled: true
      storageClass: standard-rwo
neo4j:
  volumes:
    data:
      mode: dynamic
      dynamic:
        storageClassName: standard-rwo
        accessModes: ["ReadWriteOnce"]
        requests:
          storage: 5Gi
redis:
  master:
    persistence:
      enabled: true
      storageClass: standard-rwo
objectStorage:
  kind: seaweedfs
