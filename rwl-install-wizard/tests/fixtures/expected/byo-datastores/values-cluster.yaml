postgresql:
  kind: external
  deploy: false
  external:
    host: pg.example.com
    port: "5432"
    database: core
    username: runwhen
redis:
  deploy: false
  external:
    host: redis.example.com
    port: "6379"
neo4j:
  deploy: false
  external:
    uri: bolt://neo4j.example.com:7687
    username: neo4j
vault:
  deploy: false
  # MISSED-11: chart reads the external Vault URL in TWO shapes — flat
  # vault.address / vault.runnerAddress (VAULT_URL / RUNNER_VAULT_URL) AND nested
  # vault.external.* (csi/agentfarm/webhooks). Both point at the operator's Vault.
  address: https://vault.example.com
  runnerAddress: https://vault.example.com
  authMountPoint: kubernetes
  external:
    address: https://vault.example.com
    authMountPoint: kubernetes
qdrant:
  deploy: false
  useSubchart: false
  external:
    url: http://qdrant.example.com:6333
