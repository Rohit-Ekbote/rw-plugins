# knob-catalog.yaml — SOURCE OF TRUTH for rwl-install-wizard.
#
# MAINTENANCE CONTRACT: a new chart knob or a newly logged friction is an edit
# to THIS file (and a data/ file), never a change to the skills.
#
# chartCompat: ">=0.2.37 <0.3"
#   Floor is 0.2.37: the catalog assumes the chart auto-derives CORS/CSRF/login
#   hosts from global.domain (browserOrigins.autoDerive, default in 0.2.37+), so
#   cluster-shape does not emit those keys. Raise the floor if a future axis
#   relies on a newer chart feature.
#
# AUTHORING RULES (enforced by lib/catalog-lint.sh):
#   - guide_sections / known_issues MUST be single-line inline arrays:
#       guide_sections: [some-id, other-id]
#   - emits: MUST NOT contain an inline secret literal. Wire secrets by name
#     (existingSecret / *Ref) only.
#   - Every option block (- id:) carries a label:. Axes carry title: + question:.
#
# FREE-VALUE INPUTS (params):
#   An axis (or option) may declare a `params:` list for non-sensitive free
#   values the operator types (domain, registry host, UID, StorageClass name).
#   Reference each param in `emits:` as an angle-bracket placeholder; the wizard
#   substitutes it from the operator's answer at GENERATE time. Example:
#       params:
#         - { id: domain, prompt: "Public base domain (e.g. rw.example.com)" }
#       emits:
#         ingress: { host: "papi.<DOMAIN>" }
#   Placeholders are <UPPER_SNAKE> of the param id. Never use a param for a
#   secret — params are shape facts only.
chartCompat: ">=0.2.37 <0.3"
axes:
  - id: networking
    title: Pod network CIDR
    question: "Is your cluster's pod network in standard private (RFC1918) ranges?"
    options:
      - id: rfc1918
        label: "Yes — 10.x / 172.16–31.x / 192.168.x (default)"
        emits: {}
        guide_sections: []
        known_issues: []
      - id: non-rfc1918
        label: "No — non-RFC1918 space (e.g. carrier/DoD 21.121.x)"
        overlay: values-cluster.yaml
        emits:
          metricstore:
            config:
              memberlist:
                bind_addr: ["127.0.0.1"]
                advertise_addr: "127.0.0.1"
        guide_sections: [networking-non-rfc1918]
        known_issues: [mimir-memberlist-no-private-ip]

  - id: cluster-shape
    title: Cluster environment
    question: "What domain and storage/ingress infrastructure does this cluster use?"
    params:
      - { id: domain, prompt: "Public base domain (e.g. rw.example.com)", required: true }
    options:
      - id: clusterIssuer
        label: "cert-manager ClusterIssuer (ACME / Let's Encrypt or private ACME)"
        overlay: values-cluster.yaml
        params:
          - { id: tlsClusterIssuer, prompt: "cert-manager ClusterIssuer name (e.g. letsencrypt-prod)" }
          - { id: ingressClass, prompt: "IngressClass name — must match an ingress controller already installed in the cluster (kubectl get ingressclass; common: nginx, ingress-nginx, traefik).", required: true }
        emits:
          global:
            domain: "<DOMAIN>"
          ingress:
            enabled: true
            className: "<INGRESS_CLASS>"
            tls:
              enabled: true
              existingSecret: ""
              certManager:
                enabled: true
                clusterIssuer: "<TLS_CLUSTER_ISSUER>"
        guide_sections: [cluster-domain, ingress-tls]
        known_issues: [papi-cors-csrf-custom-hosts, ingress-not-rendered, tls-clusterissuer-vs-issuer]
        prereqs: [cert-manager, ingress-controller]

      - id: issuer
        label: "cert-manager Issuer (namespace-scoped; runner-control style)"
        overlay: values-cluster.yaml
        params:
          - { id: tlsIssuer, prompt: "cert-manager Issuer name (namespace-scoped, e.g. selfsigned-issuer)" }
          - { id: ingressClass, prompt: "IngressClass name — must match an ingress controller already installed in the cluster (kubectl get ingressclass; common: nginx, ingress-nginx, traefik).", required: true }
        emits:
          global:
            domain: "<DOMAIN>"
          ingress:
            enabled: true
            className: "<INGRESS_CLASS>"
            annotations:
              cert-manager.io/issuer: "<TLS_ISSUER>"
            tls:
              enabled: true
              existingSecret: ""
              certManager:
                enabled: true
                clusterIssuer: ""
        guide_sections: [cluster-domain, ingress-tls]
        known_issues: [papi-cors-csrf-custom-hosts, ingress-not-rendered, tls-clusterissuer-vs-issuer]
        prereqs: [cert-manager, ingress-controller]

      - id: byoSecret
        label: "Bring-your-own TLS Secret (pre-issued wildcard cert in the release namespace)"
        overlay: values-cluster.yaml
        params:
          - { id: tlsSecret, prompt: "Name of the pre-created Kubernetes TLS Secret holding *.<DOMAIN> cert (e.g. wildcard-rw-example-com-tls)" }
          - { id: ingressClass, prompt: "IngressClass name — must match an ingress controller already installed in the cluster (kubectl get ingressclass; common: nginx, ingress-nginx, traefik).", required: true }
        emits:
          global:
            domain: "<DOMAIN>"
          ingress:
            enabled: true
            className: "<INGRESS_CLASS>"
            tls:
              enabled: true
              existingSecret: "<TLS_SECRET>"
              certManager:
                enabled: false
        guide_sections: [cluster-domain, ingress-tls, secret-preflight-checklist]
        known_issues: [papi-cors-csrf-custom-hosts, ingress-not-rendered]
        prereqs: [ingress-controller]

      - id: gatewayApi
        label: "Gateway API — cluster routes via Gateway API (HTTPRoute), not Ingress; the chart's Ingress objects are left disabled"
        overlay: values-cluster.yaml
        # [3] Gateway-API clusters do not use the chart's Ingress. Emit ONLY the
        # domain and touch NO ingress.* keys — the chart default (ingress.enabled:
        # false) already leaves Ingress objects unrendered. The operator provisions
        # their own Gateway + HTTPRoute + TLS (see PREREQUISITES: gateway-api).
        emits:
          global:
            domain: "<DOMAIN>"
        guide_sections: [cluster-domain]
        known_issues: []
        prereqs: [gateway-api]

  - id: registry-routing
    title: Container registry routing
    question: "How do cluster nodes pull container images — direct from public upstreams, or via a customer-side mirror?"
    options:
      - id: connected
        label: "Connected — pull direct from public upstreams (no mirror)"
        emits: {}
        guide_sections: [registry-connected, chart-version, helm-install-command]
        known_issues: []

      # NOTE (v0.1.3, MISSED-1): the former `flat-mirror` option (top-level
      # `registryOverride`) was REMOVED. The chart's `runwhen.image` /
      # `runwhen.postgresql.spilo.image` helpers apply registryOverride FIRST
      # (`$regOverride | default .service.registry | default .global.registry`),
      # so it collapses every image to `<mirror>/<repository>` — dropping the
      # source path AND silently discarding per-subchart `image.registry`
      # overrides — while the image manifest pushes to `<mirror>/<source-path>`.
      # Overlay and manifest then disagree → ImagePullBackOff. The real air-gap
      # install (infra-flux .../airgap/runwhen-platform/helmrelease.yaml) uses the
      # per-upstream, path-preserving model below and NEVER sets registryOverride.
      # See the chart's own `runwhen.image` doc block: "For COMPLEX registry
      # layouts ... DO NOT set registryOverride."
      - id: mirrored-per-upstream
        label: "Air-gap mirror — per-upstream repos, path-preserving (JFrog/Artifactory/JCR, Harbor proxy projects, ECR pull-through). RECOMMENDED for air-gap."
        overlay: values-registry.yaml
        params:
          - { id: registryHost, prompt: "Mirror registry host (e.g. artifactory.corp.example or jcr.example.com). The per-upstream repo segments below (docker-dockerhub, docker-ghcr, docker-runwhen-self-hosted, docker-suse) are the remote-repo names you created on the mirror — rename them here if your mirror uses different ones.", required: true }
          - { id: pullSecretName, prompt: "Name of the pre-created Kubernetes image pull Secret (e.g. jcr-pull-secret)" }
          - { id: helmMirrorUrl, prompt: "Helm CHART repo base URL for the five subchart aliases — a Helm chart repository, NOT the image path above (Artifactory serves charts from a helm-type repo, e.g. https://jcr.example.com/artifactory/helm-virtual; Harbor under /chartrepo/<project> — both distinct from the docker-* image remotes). Leave blank if you mirror only images (charts registered manually)." }
        emits:
          # N1: this warning is injected as a YAML value (not a comment, which
          # parse/merge drops) so it survives GENERATE. pinnedTags are the single
          # source of truth shared with airgap-image-manifest.md (guard asserts match).
          x-airgap-pinned-tags-notice:
            warning: >-
              PINNED subchart image tags in this overlay target chart ~0.2.x. VERIFY
              each against your Chart.lock (run `helm dependency update`, then read
              Chart.lock) and the air-gap image manifest in your USER-GUIDE before
              installing — the mirror must hold the exact tag your chart resolves, or
              the image pull fails. These full-value overrides beat the chart's own
              resolved subchart pins.
            pinnedTags:
              neo4j: "5.26.0"
              vault: "1.21.2"
              bciBaseHelmTest: "15.7"
          # Per-upstream, path-preserving. NO registryOverride — each image keeps
          # its source path under the matching per-upstream remote, so the rendered
          # ref equals the manifest push target (airgap-image-manifest.md).
          global:
            imagePullSecrets:
              - name: "<PULL_SECRET_NAME>"
            utility:
              busybox:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
              dbInit:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
              vaultClient:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
          images:
            pullSecrets:
              - name: "<PULL_SECRET_NAME>"
            registry: "<REGISTRY_HOST>/docker-runwhen-self-hosted/runwhen-self-hosted/platform-images"
            mcpServer:
              registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
            ccCatalog:
              registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
            llmGateway:
              registry: "<REGISTRY_HOST>/docker-ghcr/berriai"
          runnerMetricProxy:
            image:
              registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
          # MISSED-7: cc-catalog-svc must auth to the mirror to LIST codecollection
          # tags. Reuse the kubelet image pull Secret (kubernetes.io/dockerconfigjson);
          # chart projects it in and exports CC_CATALOG_DOCKERCONFIGJSON_FILE.
          ccCatalog:
            auth:
              dockerconfigjsonSecret: "<PULL_SECRET_NAME>"
            # The chart-default cc-catalog sources point image_registry at public
            # ghcr.io/runwhen-contrib — in air-gap the runner then can't pull task
            # images. Repoint each at the mirror (git_url stays upstream, matching
            # the real air-gap reference; mirror git separately if egress is denied).
            config:
              sources:
                - name: mirror-remote-runwhen
                  type: oci
                  auth:
                    dockerconfigjson_env: CC_CATALOG_DOCKERCONFIGJSON_FILE
                  codecollections:
                    - slug: rw-cli-codecollection
                      name: RunWhen CLI CodeCollection
                      git_url: https://github.com/runwhen-contrib/rw-cli-codecollection
                      image_registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib/rw-cli-codecollection"
                    - slug: rw-public-codecollection
                      name: RunWhen Public CodeCollection
                      git_url: https://github.com/runwhen-contrib/rw-public-codecollection
                      image_registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib/rw-public-codecollection"
                    - slug: rw-generic-codecollection
                      name: RunWhen Generic CodeCollection
                      git_url: https://github.com/runwhen-contrib/rw-generic-codecollection
                      image_registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib/rw-generic-codecollection"
                    - slug: rw-workspace-utils
                      name: RunWhen Workspace Utilities CodeCollection
                      git_url: https://github.com/runwhen-contrib/rw-workspace-utils
                      image_registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib/rw-workspace-utils"
                    - slug: aws-c7n-codecollection
                      name: AWS CloudCustodian CodeCollection
                      git_url: https://github.com/runwhen-contrib/aws-c7n-codecollection
                      image_registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib/aws-c7n-codecollection"
                    - slug: azure-c7n-codecollection
                      name: Azure CloudCustodian CodeCollection
                      git_url: https://github.com/runwhen-contrib/azure-c7n-codecollection
                      image_registry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib/azure-c7n-codecollection"
          postgresql:
            spilo:
              image:
                registry: "<REGISTRY_HOST>/docker-ghcr/zalando"
            pgbouncer:
              image:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
          # --- Bundled subchart images (Vault server, Redis, Neo4j, Qdrant,
          # SeaweedFS) — subchart-emitted, so registry-portion knobs do not reach
          # them. Full mirrored paths route through the docker-dockerhub remote. ---
          redis:                         # docker.io/bitnamilegacy/redis
            image:
              registry: "<REGISTRY_HOST>/docker-dockerhub"
              repository: "bitnamilegacy/redis"
          neo4j:                         # docker.io/library/neo4j (full-path customImage)
            # MISSED-10: with image.imagePullSecrets set (below), the neo4j subchart
            # aborts at TEMPLATE + install time ("Missing imageCredential entry for
            # <secret>") unless disableLookups is true. REQUIRED — render fails
            # without it; the real air-gap install sets it (helmrelease.yaml:297).
            disableLookups: true
            image:
              customImage: "<REGISTRY_HOST>/docker-dockerhub/library/neo4j:5.26.0"   # PINNED-TAG 5.26.0 — see x-airgap-pinned-tags-notice
              imagePullSecrets:
                - "<PULL_SECRET_NAME>"
          vault:
            server:                      # docker.io/hashicorp/vault (subchart server; full-path repository)
              image:
                repository: "<REGISTRY_HOST>/docker-dockerhub/hashicorp/vault"
                tag: "1.21.2"            # PINNED-TAG 1.21.2 — see x-airgap-pinned-tags-notice
            autoUnseal:                  # chart-native jobs, docker.io/hashicorp/vault
              image:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
            backup:
              image:
                registry: "<REGISTRY_HOST>/docker-dockerhub"
          qdrant:                        # docker.io/qdrant/qdrant (full-path repository)
            # Defensive parity with neo4j: the pinned qdrant subchart (1.18.2) has NO
            # disableLookups guard, so this is a harmless no-op for the current chart
            # (render verified to pass without it) — set for forward-compat if a future
            # qdrant subchart adopts the same lookup guard neo4j uses.
            disableLookups: true
            image:
              repository: "<REGISTRY_HOST>/docker-dockerhub/qdrant/qdrant"
            imagePullSecrets:
              - name: "<PULL_SECRET_NAME>"
            chartTests:                  # registry.suse.com/bci/bci-base — helm-test-only pod (docker-suse remote)
              dbInteraction:
                image: "<REGISTRY_HOST>/docker-suse/bci/bci-base:15.7"   # PINNED-TAG 15.7 — see x-airgap-pinned-tags-notice
          metricstore:
            image:
              registry: "<REGISTRY_HOST>/docker-dockerhub"
          seaweedfs:                     # docker.io/chrislusf/seaweedfs
            global:
              seaweedfs:
                image:
                  name: "<REGISTRY_HOST>/docker-dockerhub/chrislusf/seaweedfs"
            image:
              repository: "<REGISTRY_HOST>/docker-dockerhub/chrislusf/seaweedfs"
          # MISSED-6: codecollection images default to ghcr.io/runwhen-contrib.
          # Repoint every entry at the mirror's docker-ghcr remote so the runner
          # pulls task images from the mirror, not public ghcr.
          codeCollections:
            - name: runwhen-collection
              repoUrl: https://github.com/runwhen-contrib/rw-public-codecollection.git
              branch: main
              watchAllBranches: true
              imageRegistry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
              imageRepo: rw-public-codecollection
            - name: runwhen-c7n-collection
              repoUrl: https://github.com/runwhen-contrib/azure-c7n-codecollection.git
              branch: main
              watchAllBranches: true
              imageRegistry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
              imageRepo: azure-c7n-codecollection
            - name: aws-c7n-cc
              repoUrl: https://github.com/runwhen-contrib/aws-c7n-codecollection.git
              branch: main
              watchAllBranches: true
              imageRegistry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
              imageRepo: aws-c7n-codecollection
            - name: runwhen-cli-collection
              repoUrl: https://github.com/runwhen-contrib/rw-cli-codecollection.git
              branch: main
              watchAllBranches: true
              imageRegistry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
              imageRepo: rw-cli-codecollection
            - name: runwhen-generic-collection
              repoUrl: https://github.com/runwhen-contrib/rw-generic-codecollection.git
              branch: main
              watchAllBranches: true
              imageRegistry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
              imageRepo: rw-generic-codecollection
            - name: rw-workspace-utils
              repoUrl: https://github.com/runwhen-contrib/rw-workspace-utils.git
              branch: main
              watchAllBranches: true
              imageRegistry: "<REGISTRY_HOST>/docker-ghcr/runwhen-contrib"
              imageRepo: rw-workspace-utils
        guide_sections: [registry-jfrog-per-upstream, subchart-alias-mirroring, airgap-image-manifest, chart-version, secret-preflight-checklist, helm-install-command]
        known_issues: [hardcoded-image-refs, embedder-airgap-hang, thin-chart-subchart-aliases, seaweedfs-image-chrislusf]
        prereqs: [registry-access]

  - id: storage-persistence
    title: Persistence tier
    question: "How should rebuildable components (Mimir, Neo4j, Redis) and SeaweedFS persist their data?"
    params:
      - { id: storageClass, prompt: "StorageClass name for durable volumes (e.g. standard-rwo, gp3, managed-csi)" }
    options:
      - id: pvc
        label: "Durable PVCs — every stateful component on PVCs (cluster must have an RWO StorageClass)"
        overlay: values-storage.yaml
        emits:
          seaweedfs:
            master:
              data:
                storageClass: "<STORAGE_CLASS>"
            volume:
              dataDirs:
                - name: data1
                  type: persistentVolumeClaim
                  size: "20Gi"
                  storageClass: "<STORAGE_CLASS>"
                  maxVolumes: 60
            filer:
              data:
                type: persistentVolumeClaim
                storageClass: "<STORAGE_CLASS>"
                size: 5Gi
          metricstore:
            persistence:
              # MISSED-3: chart key is storageClassName (NOT storageClass — that
              # was silently ignored). kind: pvc so the class is actually used.
              kind: pvc
              storageClassName: "<STORAGE_CLASS>"
          qdrant:
            persistence:
              storageClassName: "<STORAGE_CLASS>"
          # MISSED-4: the label promises "every stateful component on PVCs", so
          # wire the chosen StorageClass into Spilo/Vault/Neo4j/Redis too — each
          # uses a DIFFERENT key (verified against the chart + subchart schemas).
          postgresql:
            spilo:
              persistence:
                kind: pvc
                storageClassName: "<STORAGE_CLASS>"
          vault:
            server:
              dataStorage:
                enabled: true
                storageClass: "<STORAGE_CLASS>"
          neo4j:
            volumes:
              data:
                # defaultStorageClass mode CANNOT set a class name (chart fails);
                # dynamic mode is the one that pins a named StorageClass.
                mode: dynamic
                dynamic:
                  storageClassName: "<STORAGE_CLASS>"
                  accessModes: ["ReadWriteOnce"]
                  requests:
                    storage: 5Gi
          redis:
            master:
              persistence:
                enabled: true
                storageClass: "<STORAGE_CLASS>"
        guide_sections: [storage-pvc, storageclass]
        known_issues: [postgres-storage-kind]

      - id: nfs
        label: "NFS posture — SeaweedFS data on NFS PVCs; rebuildables (Mimir, Redis, Neo4j) on emptyDir; Qdrant on emptyDir (NFS not supported by vendor)"
        overlay: values-storage.yaml
        emits:
          seaweedfs:
            master:
              data:
                storageClass: "<STORAGE_CLASS>"
            volume:
              dataDirs:
                - name: data1
                  type: persistentVolumeClaim
                  size: "20Gi"
                  storageClass: "<STORAGE_CLASS>"
                  maxVolumes: 60
            filer:
              data:
                type: persistentVolumeClaim
                storageClass: "<STORAGE_CLASS>"
                size: 5Gi
              logs:
                type: emptyDir
            s3:
              logs:
                type: emptyDir
          redis:
            master:
              persistence:
                enabled: false
          neo4j:
            volumes:
              data:
                mode: volume
                volume:
                  emptyDir:
                    sizeLimit: 5Gi
          metricstore:
            persistence:
              kind: emptyDir
              size: 10Gi
          qdrant:
            useSubchart: false
        guide_sections: [storage-nfs]
        known_issues: [postgres-storage-kind, mimir-wal-ephemeral, qdrant-no-nfs]

      - id: emptyDir
        label: "emptyDir (lab/ephemeral) — rebuildables on emptyDir; no RWO StorageClass required"
        overlay: values-storage.yaml
        emits:
          metricstore:
            persistence:
              kind: emptyDir
              size: 10Gi
          redis:
            master:
              persistence:
                enabled: false
          neo4j:
            volumes:
              data:
                mode: volume
                volume:
                  emptyDir:
                    sizeLimit: 5Gi
          postgresql:
            spilo:
              persistence:
                kind: emptyDir
          qdrant:
            useSubchart: false
        guide_sections: [storage-emptydir]
        known_issues: [postgres-storage-kind, mimir-wal-ephemeral, qdrant-no-nfs]

  - id: security-posture
    title: Pod security hardening
    question: "How should pods run — chart defaults (already hardened) or an explicit overlay with your own UID/GID and webhook labels?"
    options:
      - id: default
        label: "Default — chart ships hardened by default (non-root uid 1000, read-only rootfs, caps dropped); no overlay needed"
        emits: {}
        guide_sections: []
        known_issues: []

      - id: hardened
        label: "Explicit hardened overlay — set your own UID/GID and optional webhook labels; satisfies PSS restricted"
        overlay: values-posture.yaml
        params:
          - { id: runAsUid, prompt: "Non-root UID for first-party pods (e.g. 65534; must not be 0 or 500)" }
          - { id: runAsGid, prompt: "GID for first-party pods (e.g. 65534; keep equal to runAsUid for volume ownership)" }
        emits:
          global:
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: "<RUN_AS_UID>"
              runAsGroup: "<RUN_AS_GID>"
              fsGroup: "<RUN_AS_GID>"
              seccompProfile:
                type: RuntimeDefault
            containerSecurityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
          # [5] global.containerSecurityContext.readOnlyRootFilesystem:true breaks
          # Spilo/Patroni (needs a writable rootfs), and the chart REPLACES the
          # global context with spilo.containerSecurityContext when set
          # (spilo-statefulset.yaml:117). Re-assert the other hardening and relax
          # ONLY readOnlyRootFilesystem. Inert under byo/external postgres (kind!=spilo).
          postgresql:
            spilo:
              containerSecurityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
        guide_sections: [nonroot-uid, readonly-rootfs, webhook-labels-securitycontext]
        known_issues: [vault-init-home-perms, llm-gateway-nonroot-prisma, mass-run-as-root-failures]

  - id: ingress-snippets
    title: Ingress snippet annotations
    # dependsOn: applies only when cluster-shape is an Ingress option (clusterIssuer/
    # issuer/byoSecret), NOT gatewayApi. SKILL skips this axis under Gateway API.
    # Default: SKILL pre-selects snippets-blocked when security-posture=hardened.
    question: "Does your ingress controller allow nginx snippet annotations? Hardened / CVE-2021-25742-patched ingress-nginx rejects them (allow-snippet-annotations=false has been the controller default since v1.9). If you chose the hardened security posture, answer No unless you have explicitly re-enabled snippets."
    options:
      - id: snippets-allowed
        label: "Yes — controller permits snippet annotations (chart-managed mTLS path for runner metrics)"
        overlay: values-cluster.yaml
        emits:
          ingress:
            allowSnippetAnnotations: true
        guide_sections: []
        known_issues: []
      - id: snippets-blocked
        label: "No — controller rejects snippets; render the runner-metric-proxy Ingress without them"
        overlay: values-cluster.yaml
        # [4] With snippets off the chart drops the runner-metric-proxy Ingress
        # unless renderWithoutSnippet=true, and cnValidation must be disabled (it
        # depends on the snippet annotations). See runner-metric-proxy/ingress.yaml.
        emits:
          ingress:
            allowSnippetAnnotations: false
          runnerMetricProxy:
            cnValidation:
              enabled: false
            ingress:
              renderWithoutSnippet: true
        guide_sections: []
        known_issues: [alert-ingestor-snippet-annotation]
        prereqs: [snippet-annotations]

  - id: object-storage
    title: Object storage backend
    question: "Which S3 backend should the platform use for workspace uploads, Mimir blocks, and backup storage?"
    # releaseName is collected here because bundled SeaweedFS needs it (MISSED-2):
    # the seaweedfs subchart cannot see the parent Helm release name, so
    # `seaweedfs.s3.existingConfigSecret` must be pinned to `<release>-seaweedfs-identities`
    # or `runwhen.objectStorage.validate` fail-fasts at template time. It is also
    # the `<RELEASE>` used in the helm install command and the derived Service names.
    params:
      - { id: releaseName, prompt: "Helm release name you will install under (e.g. rw, rw-airgap). Used as `helm install <RELEASE>` AND to pin the SeaweedFS identities Secret name — must match exactly." }
    options:
      - id: seaweedfs
        label: "Bundled SeaweedFS — Apache 2.0, namespace-scoped, no CRDs (default)"
        overlay: values-storage.yaml
        emits:
          objectStorage:
            kind: seaweedfs
          seaweedfs:
            deploy: true
            s3:
              # MISSED-2: chart's runwhen.objectStorage.validate requires this to
              # equal `<release>-seaweedfs-identities` (the identities Secret the
              # chart renders). Wrong/blank → template fail-fast.
              existingConfigSecret: "<RELEASE_NAME>-seaweedfs-identities"
        guide_sections: [object-storage-seaweedfs]
        known_issues: [seaweedfs-s3-access-denied]

      - id: external-s3
        label: "External S3 — AWS S3, GCS S3-interop, Backblaze, or any S3-compatible endpoint"
        overlay: values-storage.yaml
        params:
          - { id: s3Endpoint, prompt: "S3 endpoint URL (e.g. https://s3.amazonaws.com or http://internal-s3:9000)" }
          - { id: s3Bucket, prompt: "Shared workspace bucket name (e.g. shared-workspace)" }
          - { id: s3ExistingSecret, prompt: "Name of the pre-created Kubernetes Secret holding S3 credentials (existingSecret)" }
        emits:
          objectStorage:
            kind: external
            external:
              host: "<S3_ENDPOINT>"
              internalHost: "<S3_ENDPOINT>"
              bucket: "<S3_BUCKET>"
            existingSecret: "<S3_EXISTING_SECRET>"
          seaweedfs:
            deploy: false
        guide_sections: [object-storage-external-s3, secret-preflight-checklist]
        known_issues: []

  - id: rbac-identity
    title: RBAC and identity posture
    question: "Who creates ServiceAccounts and ClusterRoleBindings — the chart, or your RBAC pipeline?"
    options:
      - id: chart-managed
        label: "Chart-managed — chart creates ServiceAccounts and RoleBindings normally (default)"
        emits: {}
        guide_sections: []
        known_issues: []

      - id: byo
        label: "BYO — enterprise RBAC pipeline pre-provisions SAs; chart must not create them or any ClusterRoleBindings"
        overlay: values-posture.yaml
        params:
          - { id: platformSaName, prompt: "Pre-provisioned ServiceAccount name for platform backend pods (e.g. rw-platform)" }
          - { id: vaultBackupSaName, prompt: "Pre-provisioned ServiceAccount name for vault-backup CronJob (e.g. rw-vault-backup)" }
          - { id: postgresqlSaName, prompt: "Pre-provisioned ServiceAccount name for Spilo/postgresql (e.g. rw-postgresql)" }
        emits:
          serviceAccount:
            platform:
              create: false
              name: "<PLATFORM_SA_NAME>"
            vaultBackup:
              create: false
              name: "<VAULT_BACKUP_SA_NAME>"
            postgresql:
              create: false
              name: "<POSTGRESQL_SA_NAME>"
          vault:
            injector:
              enabled: false
            server:
              authDelegator:
                enabled: false
          global:
            imagePullSecrets: []
          images:
            pullSecrets: []
        guide_sections: [byo-serviceaccounts, no-clusterrolebindings, vault-injector-authdelegator, no-imagepullsecrets]
        known_issues: [vault-clusterrolebinding-blocked, sa-rolebinding-reserved]

  - id: internal-ca
    title: Internal / corporate CA trust
    question: "Do platform pods need to trust a private/corporate CA for in-cluster HTTPS (ingress TLS, internal git, webhooks)?"
    options:
      - id: public-ca
        label: "No — platform trusts public CAs only (default)"
        emits: {}
        guide_sections: []
        known_issues: []

      - id: internal-ca
        label: "Yes — inject a private/corporate CA trust bundle via a pre-created Secret"
        overlay: values-cluster.yaml
        params:
          - { id: caBundleSecret, prompt: "Name of the pre-created Kubernetes Secret holding the CA bundle (e.g. corp-ca-bundle)" }
          - { id: bundleFile, prompt: "Filename key inside the Secret (e.g. ca-bundle.crt — must match --from-file=<key> used when creating the Secret)" }
        emits:
          global:
            trustBundle:
              enabled: true
              existingSecret: "<CA_BUNDLE_SECRET>"
              bundleFile: "<BUNDLE_FILE>"
              setEnvVars: true
        guide_sections: [internal-ca-trust-bundle, secret-preflight-checklist]
        known_issues: [mcp-server-ssl-verify-failed]

  - id: runwhen-ca
    title: Internal runner CA (cert-manager)
    question: "Is cert-manager installed in this cluster? The chart's internal runner CA (runwhenCA.deploy, default on) renders cert-manager.io/v1 Issuer + Certificate objects; cert-manager ClusterIssuer/Issuer ingress TLS also requires it."
    options:
      - id: cert-manager-present
        label: "Yes — cert-manager is installed (keep the chart's internal runner CA)"
        emits: {}
        guide_sections: []
        known_issues: []
        prereqs: [cert-manager]
      - id: no-cert-manager
        label: "No — cert-manager is NOT installed (disable the internal runner CA: runwhenCA.deploy: false)"
        overlay: values-cluster.yaml
        # [2] runwhenCA.deploy=true (chart default) renders cert-manager Issuer +
        # Certificate; templates/certmanager.yaml is wholly gated on deploy, so
        # deploy:false renders nothing there and needs no external issuer names.
        emits:
          runwhenCA:
            deploy: false
        guide_sections: []
        known_issues: []

  - id: llm-endpoint
    title: LLM endpoint
    question: "How should the platform reach an LLM for chat, background summarisation, and embedding?"
    options:
      - id: configure-later
        label: "Configure later — do NOT deploy the LLM gateway yet (llmGateway.deploy: false); wire model_list before enabling LLM features"
        overlay: values-cluster.yaml
        # [1] The chart fail-fasts when llmGateway.deploy=true (its default) with an
        # empty model_list. "Configure later" therefore emits deploy:false — a valid,
        # install-ready state — instead of emitting nothing and leaving the hard-fail latent.
        emits:
          llmGateway:
            deploy: false
        guide_sections: [llm-endpoint]
        known_issues: [llm-bootstrap-egress]
        prereqs: [llm-configure-later]

      - id: internal-openai
        label: "Internal OpenAI-compatible endpoint — wire a corporate or on-premises model gateway via LiteLLM proxy"
        overlay: values-cluster.yaml
        params:
          - { id: llmBaseUrl, prompt: "LLM endpoint base URL (e.g. https://llm.internal.example/v1 — non-secret)", consumers: { equals: [api_base] } }
          - { id: chatModelName, prompt: "LiteLLM model_name for chat (e.g. customer-chat — must be unique per model role)" }
          - { id: chatModel, prompt: "Upstream model identifier for chat (e.g. openai/gpt-4o or azure/my-gpt4o)" }
          - { id: bgModelName, prompt: "LiteLLM model_name for background/summarisation (e.g. customer-bg)" }
          - { id: bgModel, prompt: "Upstream model identifier for background (e.g. openai/gpt-4o-mini)" }
          - { id: embeddingModelName, prompt: "LiteLLM model_name for embedding (e.g. customer-embedding)" }
          - { id: embeddingModel, prompt: "Upstream model identifier for embedding (e.g. openai/text-embedding-3-small)" }
          - { id: llmApiKeySecret, prompt: "Name of the pre-created Kubernetes Secret holding the upstream API key (existingSecret name — not the key value)" }
          - { id: llmApiKeyEnv, prompt: "Env var name the LiteLLM key is exposed as (from the providers Secret), e.g. LLM_API_KEY" }
          - { id: llmStaffEmail, prompt: "Staff/service-account email that OWNS the seeded LLM provider in PAPI (e.g. default-sa@runwhen.com). llmBootstrap seeds PAPI's llm_providers under this identity." }
          - { id: llmProviderName, prompt: "A stable name for the PAPI llm_providers row (e.g. customer-litellm). Free label; keep it constant across upgrades." }
          - { id: embeddingDimension, prompt: "Vector dimension your embedding model emits (e.g. 1536 for text-embedding-3-small; 384 for bge-small). Must match the model — a wrong value surfaces as pgvector insert errors." }
        emits:
          llmGateway:
            deploy: true
            providersExistingSecret: "<LLM_API_KEY_SECRET>"
            models:
              - model_name: "<CHAT_MODEL_NAME>"
                litellm_params:
                  model: "<CHAT_MODEL>"
                  api_base: "<LLM_BASE_URL>"
                  api_key: "os.environ/<LLM_API_KEY_ENV>"
                model_info:            # MISSED-8: role type; chat + bg are both chat-class
                  mode: chat
              - model_name: "<BG_MODEL_NAME>"
                litellm_params:
                  model: "<BG_MODEL>"
                  api_base: "<LLM_BASE_URL>"
                  api_key: "os.environ/<LLM_API_KEY_ENV>"
                model_info:
                  mode: chat
              - model_name: "<EMBEDDING_MODEL_NAME>"
                litellm_params:
                  model: "<EMBEDDING_MODEL>"
                  api_base: "<LLM_BASE_URL>"
                  api_key: "os.environ/<LLM_API_KEY_ENV>"
                model_info:
                  mode: embedding
          # MISSED-5: without llmBootstrap the gateway serves models but PAPI's
          # llm_providers / llm_models rows are never seeded, so the platform's LLM
          # features stay inert. Seed them from the same model_names above. The
          # names MUST match llmGateway.models[].model_name exactly.
          llmBootstrap:
            enabled: true
            staffUser:
              email: "<LLM_STAFF_EMAIL>"
            provider:
              name: "<LLM_PROVIDER_NAME>"
            models:
              chat:
                name: "<CHAT_MODEL_NAME>"
                maxTokens: 0
              bg:
                name: "<BG_MODEL_NAME>"
                maxTokens: 0
              embedding:
                name: "<EMBEDDING_MODEL_NAME>"
                maxTokens: 0
                dimension: <EMBEDDING_DIMENSION>
        guide_sections: [llm-endpoint, secret-preflight-checklist]
        known_issues: [llm-bootstrap-egress, tiktoken-dns-benign, litellm-configmap-placeholder, embedder-airgap-hang]

  - id: subcharts
    title: Datastore deployment mode
    question: "Should datastores (PostgreSQL, Redis, Neo4j, Vault, Qdrant) run as bundled in-cluster subcharts, or should the platform connect to externally-managed services?"
    options:
      - id: bundled-all
        label: "Bundled — deploy all five datastores as in-cluster subcharts (default)"
        overlay: values-cluster.yaml
        emits:
          # [6] Pin the postgresql backend explicitly. The chart default is spilo
          # (values.yaml:623), but relying on the default means a byo/external
          # overlay is not the ONLY thing that can change it. Mirrors objectStorage.kind.
          postgresql:
            kind: spilo
        guide_sections: [subchart-bundled]
        known_issues: [postgres-bundled-single-pod, vault-order-of-operations, neo4j-workload-name]

      - id: byo-datastores
        label: "BYO external — connect to externally-managed datastores (disable bundled subcharts)"
        overlay: values-cluster.yaml
        params:
          - { id: pgHost, prompt: "PostgreSQL external host (e.g. pg.example.com or Cloud SQL private IP)", consumers: { contains: [DATABASE_URL] } }
          - { id: pgPort, prompt: "PostgreSQL port (default 5432)" }
          - { id: pgDatabase, prompt: "PostgreSQL database name (default core)" }
          - { id: pgUsername, prompt: "PostgreSQL username (e.g. runwhen)" }
          - { id: redisHost, prompt: "Redis external host (e.g. redis.example.com or managed Redis endpoint)", consumers: { equals: [REDIS_HOST] } }
          - { id: redisPort, prompt: "Redis port (default 6379)" }
          - { id: neo4jUri, prompt: "Neo4j Bolt URI (e.g. bolt://neo4j.example.com:7687 — NOT NFS-backed)", consumers: { equals: [NEO4J_URI, GRAPH_DB_URI] } }
          - { id: neo4jUsername, prompt: "Neo4j username (e.g. neo4j)" }
          - { id: vaultAddress, prompt: "Vault HTTPS address (e.g. https://vault.example.com — must have runner-system KV mount + k8s auth pre-configured)", consumers: { equals: [VAULT_URL, RUNNER_VAULT_URL, VAULT_ADDR] } }
          - { id: qdrantUrl, prompt: "Qdrant HTTP URL (e.g. http://qdrant.example.com:6333)" }
        emits:
          postgresql:
            kind: external
            deploy: false
            external:
              host: "<PG_HOST>"
              port: "<PG_PORT>"
              database: "<PG_DATABASE>"
              username: "<PG_USERNAME>"
          redis:
            deploy: false
            external:
              host: "<REDIS_HOST>"
              port: "<REDIS_PORT>"
          neo4j:
            deploy: false
            external:
              uri: "<NEO4J_URI>"
              username: "<NEO4J_USERNAME>"
          vault:
            deploy: false
            # MISSED-11: the chart reads the external Vault URL in TWO shapes — set
            # BOTH or the platform silently points at https://vault.<global.domain>:
            #   flat  vault.address       -> runwhen.vaultAddress       (VAULT_URL / VAULT_ADDR)
            #   flat  vault.runnerAddress -> runwhen.runnerVaultAddress (RUNNER_VAULT_URL)
            #   flat  vault.authMountPoint (VAULT_AUTH_MOUNT_POINT env; defaults kubernetes)
            #   nested vault.external.*    -> csi-secret-class / agentfarm / webhooks
            # Reuse the one <VAULT_ADDRESS> — in-cluster + runner reach the same
            # external Vault. authMountPoint is the k8s auth mount path in that Vault.
            address: "<VAULT_ADDRESS>"
            runnerAddress: "<VAULT_ADDRESS>"
            authMountPoint: kubernetes
            external:
              address: "<VAULT_ADDRESS>"
              authMountPoint: kubernetes
          qdrant:
            deploy: false
            useSubchart: false
            external:
              url: "<QDRANT_URL>"
        guide_sections: [subchart-byo-external]
        known_issues: [neo4j-external-agentfarm-usearch]

  - id: optional-components
    title: Optional integrations
    # multiSelect axis: the operator may enable any combination of these (they are
    # not mutually exclusive). No "none" option — selecting nothing IS "none".
    # See SKILL.md step 3 "Multi-select axes" for how the interview handles this.
    multiSelect: true
    question: "Which optional integrations do you want to enable? Select any combination, or none (Slack, Redis deploy pin)."
    options:
      - id: slack
        label: "Slack — wire the bundled slackbot to a Slack app via a pre-created credentials Secret"
        overlay: values-cluster.yaml
        params:
          - { id: slackSecretName, prompt: "Name of the pre-created Kubernetes Secret holding SLACK_SIGNING_SECRET, SLACK_CLIENT_ID, SLACK_CLIENT_SECRET (e.g. rw-slack-credentials)" }
        emits:
          slack:
            existingSecret: "<SLACK_SECRET_NAME>"
        guide_sections: [slack, secret-preflight-checklist]
        known_issues: [slackbot-selfhosted]

      - id: redis
        label: "Redis — explicitly pin redis.deploy: true (bundled Bitnami subchart; default is already true)"
        overlay: values-cluster.yaml
        emits:
          redis:
            deploy: true
        guide_sections: [redis-toggle]
        known_issues: [redis-deploy-switch]
